name: AI Finance Pipeline - 17维算法完整流程

on:
  schedule:
    - cron: '0 1 * * *'   # 09:00 北京
    - cron: '0 5 * * *'   # 13:00 北京
    - cron: '30 13 * * *' # 21:30 北京
    - cron: '0 22 * * *'  # 06:00 北京
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - run: pip install requests beautifulsoup4 feedparser lxml
    
    - env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: |
        echo "========================================"
        echo "AI Pipeline - 17维评分算法"
        echo "========================================"
        python .github/scripts/crawl_and_sync.py
        python .github/scripts/ai_pipeline_runner.py
    
    - name: Generate Full Website
      run: |
        echo "生成完整样式网站..."
        python .github/scripts/generate_full_website.py
    
    - uses: actions/upload-artifact@v4
      with:
        name: daily-report
        path: output/
        retention-days: 30
    
    - name: Commit to repository
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add output/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update daily report [$(date)]"
        git push
